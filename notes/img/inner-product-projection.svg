<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
    <marker id="ar-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d5c"/></marker>
  </defs>

  <!-- ===== 左圖：a=(3,1), b=(1,2) ===== -->
  <g>
    <text x="60" y="24" font-size="14" font-weight="600" fill="#222">左：a = (3, 1)，b = (1, 2)　（我選的例子，碰巧退化）</text>
    <!-- grid -->
    <g stroke="#e6e6e6" stroke-width="1">
      <line x1="60" y1="260" x2="300" y2="260"/><line x1="60" y1="200" x2="300" y2="200"/><line x1="60" y1="140" x2="300" y2="140"/><line x1="60" y1="80" x2="300" y2="80"/>
      <line x1="60" y1="80" x2="60" y2="260"/><line x1="120" y1="80" x2="120" y2="260"/><line x1="180" y1="80" x2="180" y2="260"/><line x1="240" y1="80" x2="240" y2="260"/><line x1="300" y1="80" x2="300" y2="260"/>
    </g>
    <!-- a 的方向線（延長） -->
    <line x1="60" y1="260" x2="320" y2="173.3" stroke="#1f5fbf" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
    <!-- 三角形 OAB 第三邊 b−a = (−2,1) -->
    <line x1="240" y1="200" x2="120" y2="140" stroke="#999" stroke-width="1.5"/>
    <text x="190" y="162" fill="#777">b − a = (−2, 1)</text>
    <!-- 碰巧的直角 at B -->
    <polygon points="120,140 115.5,148.9 124.5,153.4 128.9,144.5" fill="none" stroke="#999" stroke-width="1"/>
    <text x="60" y="70" fill="#777" font-size="11">B 這裡碰巧也是直角 → |b|/|a| 碰巧 = cos θ（退化）</text>
    <!-- 垂直剩餘 PB -->
    <line x1="150" y1="230" x2="120" y2="140" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="124" y="192" fill="#555" font-size="12">垂直的那份</text>
    <text x="124" y="206" fill="#555" font-size="12">PB = 1.58</text>
    <!-- 直角 at P -->
    <polygon points="150,230 140.5,233.2 137.3,223.7 146.8,220.5" fill="none" stroke="#2a9d5c" stroke-width="1.5"/>
    <!-- 影子 OP -->
    <line x1="60" y1="260" x2="150" y2="230" stroke="#2a9d5c" stroke-width="6" opacity="0.85"/>
    <text x="88" y="283" fill="#2a9d5c" font-weight="600">影子 OP = 1.58</text>
    <!-- a -->
    <line x1="60" y1="260" x2="240" y2="200" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ar-a)"/>
    <text x="246" y="204" fill="#1f5fbf" font-weight="600">A = (3, 1)</text>
    <text x="200" y="232" fill="#1f5fbf">a，|a| = 3.16</text>
    <!-- b -->
    <line x1="60" y1="260" x2="120" y2="140" stroke="#d1495b" stroke-width="2.5" marker-end="url(#ar-b)"/>
    <text x="112" y="132" fill="#d1495b" font-weight="600">B = (1, 2)</text>
    <text x="8" y="200" fill="#d1495b">b，|b| = 2.24</text>
    <!-- points -->
    <circle cx="60" cy="260" r="3" fill="#222"/><text x="48" y="276" fill="#222">O</text>
    <circle cx="150" cy="230" r="3.5" fill="#2a9d5c"/><text x="156" y="246" fill="#2a9d5c" font-weight="600">P = (1.5, 0.5)</text>
    <!-- 算式 -->
    <text x="60" y="314" fill="#222">直角三角形 O–P–B：斜邊 |b| = 2.24，鄰邊 OP = 1.58，對邊 PB = 1.58</text>
    <text x="60" y="334" fill="#222">cos θ = OP ÷ |b| = 1.58 ÷ 2.24 = 0.707</text>
    <text x="60" y="354" fill="#222">a·b = |a| × OP = 3.16 × 1.58 = 5　＝　3·1 + 1·2 = 5 ✓</text>
  </g>

  <!-- ===== 右圖：a=(3,1), b=(1,3) ===== -->
  <g>
    <text x="560.0" y="24" font-size="14" font-weight="600" fill="#222">右：a = (3, 1)，b = (1, 3)　（不巧的例子）</text>
    <g stroke="#e6e6e6" stroke-width="1">
      <line x1="560.0" y1="260" x2="800.0" y2="260"/><line x1="560.0" y1="200" x2="800.0" y2="200"/><line x1="560.0" y1="140" x2="800.0" y2="140"/><line x1="560.0" y1="80" x2="800.0" y2="80"/>
      <line x1="560.0" y1="80" x2="560.0" y2="260"/><line x1="620.0" y1="80" x2="620.0" y2="260"/><line x1="680.0" y1="80" x2="680.0" y2="260"/><line x1="740.0" y1="80" x2="740.0" y2="260"/><line x1="800.0" y1="80" x2="800.0" y2="260"/>
    </g>
    <line x1="560.0" y1="260" x2="820.0" y2="173.3" stroke="#1f5fbf" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
    <!-- b−a = (−2,2) -->
    <line x1="740.0" y1="200" x2="620.0" y2="80" stroke="#999" stroke-width="1.5"/>
    <text x="694.0" y="132" fill="#777">b − a = (−2, 2)</text>
    <text x="628.0" y="70" fill="#777" font-size="11">B 這裡不是直角 → |b|/|a| = 1 ≠ 0.6</text>
    <!-- PB -->
    <line x1="668.0" y1="224" x2="620.0" y2="80" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="648.0" y="150" fill="#555" font-size="12">PB = 2.53</text>
    <!-- 直角 at P -->
    <polygon points="668.0,224 658.5,227.2 655.3,217.7 664.8,214.5" fill="none" stroke="#2a9d5c" stroke-width="1.5"/>
    <!-- 影子 -->
    <line x1="560.0" y1="260" x2="668.0" y2="224" stroke="#2a9d5c" stroke-width="6" opacity="0.85"/>
    <text x="588.0" y="283" fill="#2a9d5c" font-weight="600">影子 OP = 1.90</text>
    <!-- a -->
    <line x1="560.0" y1="260" x2="740.0" y2="200" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ar-a)"/>
    <text x="746.0" y="204" fill="#1f5fbf" font-weight="600">A = (3, 1)</text>
    <text x="705.0" y="232" fill="#1f5fbf">a，|a| = 3.16</text>
    <!-- b -->
    <line x1="560.0" y1="260" x2="620.0" y2="80" stroke="#d1495b" stroke-width="2.5" marker-end="url(#ar-b)"/>
    <text x="566.0" y="86" fill="#d1495b" font-weight="600">B = (1, 3)</text>
    <text x="500" y="200" fill="#d1495b">b，|b| = 3.16</text>
    <circle cx="560.0" cy="260" r="3" fill="#222"/><text x="548.0" y="276" fill="#222">O</text>
    <circle cx="668.0" cy="224" r="3.5" fill="#2a9d5c"/><text x="674.0" y="244" fill="#2a9d5c" font-weight="600">P = (1.8, 0.6)</text>
    <text x="560.0" y="314" fill="#222">直角三角形 O–P–B：斜邊 |b| = 3.16，鄰邊 OP = 1.90，對邊 PB = 2.53</text>
    <text x="560.0" y="334" fill="#222">cos θ = OP ÷ |b| = 1.90 ÷ 3.16 = 0.6</text>
    <text x="560.0" y="354" fill="#222">a·b = |a| × OP = 3.16 × 1.90 = 6　＝　3·1 + 1·3 = 6 ✓</text>
  </g>

  <text x="60" y="386" fill="#444" font-size="12">綠色粗線 = 影子（從 B 向 a 的方向線作垂線，垂足 P 到 O 的距離）；虛線 = b 垂直 a 的那份；直角永遠在 P。</text>
  <text x="60" y="404" fill="#444" font-size="12">灰線是 b − a，它圍出的三角形 O–A–B 一般沒有直角；左圖有，是碰巧。</text>
</svg>
