<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
    <marker id="ar-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fbf"/></marker>
  </defs>

  <!-- ===== 面板 1：θ = 60° ===== -->
  <g>
    <text x="40" y="26" font-size="14" font-weight="600" fill="#222">① a、b 夾 60°（不垂直）</text>
    <polygon points="60,320 320,320 280,230 20,230" fill="#f3f3f3" stroke="#ddd"/>
    <!-- O=(170,290) A=(300,282) B=(120,240) A+B=(250,232) -->
    <polygon points="170,290 300,282 250,232 120,240" fill="#7b3fbf" opacity="0.15" stroke="#7b3fbf" stroke-dasharray="3 3"/>
    <text x="196" y="262" fill="#7b3fbf" font-size="12">面積 = 0.87 |a||b|</text>
    <line x1="170" y1="290" x2="300" y2="282" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ar-a)"/>
    <text x="304" y="288" fill="#1f5fbf" font-weight="600">a</text>
    <line x1="170" y1="290" x2="120" y2="240" stroke="#d1495b" stroke-width="2.5" marker-end="url(#ar-b)"/>
    <text x="102" y="238" fill="#d1495b" font-weight="600">b</text>
    <path d="M 200,288 A 30,30 0 0 0 190,270" fill="none" stroke="#888" stroke-width="1"/>
    <text x="196" y="300" fill="#666" font-size="11">θ = 60°</text>
    <!-- 法向量 -->
    <line x1="170" y1="290" x2="170" y2="150" stroke="#7b3fbf" stroke-width="3" marker-end="url(#ar-n)"/>
    <text x="178" y="150" fill="#7b3fbf" font-weight="600">法向量 n = a × b</text>
    <text x="178" y="166" fill="#7b3fbf" font-size="12">長度 = 面積（0.87）</text>
    <!-- 直角：n ⊥ a、n ⊥ b -->
    <polyline points="170,278 182,277 182,289" fill="none" stroke="#444" stroke-width="1.2"/>
    <polyline points="170,278 162,270 162,282" fill="none" stroke="#444" stroke-width="1.2"/>
    <text x="36" y="306" fill="#444" font-size="11">n ⊥ a 且 n ⊥ b ✓</text>
    <circle cx="170" cy="290" r="3" fill="#222"/>
  </g>

  <!-- ===== 面板 2：θ = 90° ===== -->
  <g>
    <text x="360" y="26" font-size="14" font-weight="600" fill="#222">② a、b 夾 90°（垂直）</text>
    <polygon points="380,320 640,320 600,230 340,230" fill="#f3f3f3" stroke="#ddd"/>
    <!-- O=(490,290) A=(620,282) B=(455,222) A+B=(585,214) -->
    <polygon points="490,290 620,282 585,214 455,222" fill="#7b3fbf" opacity="0.15" stroke="#7b3fbf" stroke-dasharray="3 3"/>
    <text x="516" y="256" fill="#7b3fbf" font-size="12">面積 = 1.0 |a||b|（最大）</text>
    <line x1="490" y1="290" x2="620" y2="282" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ar-a)"/>
    <text x="624" y="288" fill="#1f5fbf" font-weight="600">a</text>
    <line x1="490" y1="290" x2="455" y2="222" stroke="#d1495b" stroke-width="2.5" marker-end="url(#ar-b)"/>
    <text x="437" y="220" fill="#d1495b" font-weight="600">b</text>
    <polyline points="502,289 497,279 486,280" fill="none" stroke="#888" stroke-width="1"/>
    <text x="508" y="304" fill="#666" font-size="11">θ = 90°（這是 a 與 b 之間的垂直）</text>
    <!-- 法向量：同方向、更長 -->
    <line x1="490" y1="290" x2="490" y2="128" stroke="#7b3fbf" stroke-width="3" marker-end="url(#ar-n)"/>
    <text x="498" y="128" fill="#7b3fbf" font-weight="600">法向量 n = a × b</text>
    <text x="498" y="144" fill="#7b3fbf" font-size="12">方向跟 ① 一樣，只是更長（面積 1.0）</text>
    <polyline points="490,278 502,277 502,289" fill="none" stroke="#444" stroke-width="1.2"/>
    <polyline points="490,278 484,266 484,278" fill="none" stroke="#444" stroke-width="1.2"/>
    <circle cx="490" cy="290" r="3" fill="#222"/>
  </g>

  <!-- ===== 面板 3：θ = 0° ===== -->
  <g>
    <text x="680" y="26" font-size="14" font-weight="600" fill="#222">③ a、b 平行</text>
    <!-- 沒有平面：畫一條線 -->
    <line x1="700" y1="300" x2="920" y2="286" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- O=(800,293) -->
    <line x1="800" y1="293" x2="900" y2="287" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ar-a)"/>
    <text x="904" y="292" fill="#1f5fbf" font-weight="600">a</text>
    <line x1="800" y1="293" x2="860" y2="289.4" stroke="#d1495b" stroke-width="5" opacity="0.7" marker-end="url(#ar-b)"/>
    <text x="812" y="266" fill="#d1495b" font-weight="600">b（疊在 a 上）</text>
    <circle cx="800" cy="293" r="3" fill="#222"/>
    <circle cx="800" cy="293" r="8" fill="none" stroke="#7b3fbf" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="700" y="200" fill="#7b3fbf" font-weight="600">n = a × b = 零向量</text>
    <text x="700" y="218" fill="#555" font-size="12">張不開平面 → 沒有「平面的垂直方向」</text>
    <text x="700" y="234" fill="#555" font-size="12">長度 0、方向不定（是零，不是不存在）</text>
    <text x="700" y="330" fill="#555" font-size="12">面積 = 0</text>
  </g>

  <text x="40" y="378" fill="#222">三張圖的檢查點：法向量的「垂直」是 n 垂直於 a、b 張開的平面（①② 都有）；a 與 b 彼此垂直（②）只讓 n 變最長，不是 n 存在的條件。</text>
  <text x="40" y="398" fill="#222">① → ② 把 b 轉到 90°：n 的方向不變、長度變長；① → ③ 把 b 轉到 0°：平面消失、n 縮成零。</text>
</svg>
