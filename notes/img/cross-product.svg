<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
    <marker id="ar-b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e39aa5"/></marker>
    <marker id="ar-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fbf"/></marker>
  </defs>

  <!-- ===== 左：2D，同一個直角三角形 ===== -->
  <g>
    <text x="60" y="24" font-size="14" font-weight="600" fill="#222">左：2D　a = (3, 1)，b = (1, 3)　— 內積用鄰邊，外積用對邊</text>
    <g stroke="#e6e6e6" stroke-width="1">
      <line x1="60" y1="100" x2="310" y2="100"/><line x1="60" y1="150" x2="310" y2="150"/><line x1="60" y1="200" x2="310" y2="200"/><line x1="60" y1="250" x2="310" y2="250"/><line x1="60" y1="300" x2="310" y2="300"/><line x1="60" y1="350" x2="310" y2="350"/>
      <line x1="60" y1="100" x2="60" y2="350"/><line x1="110" y1="100" x2="110" y2="350"/><line x1="160" y1="100" x2="160" y2="350"/><line x1="210" y1="100" x2="210" y2="350"/><line x1="260" y1="100" x2="260" y2="350"/><line x1="310" y1="100" x2="310" y2="350"/>
    </g>
    <!-- 平行四邊形 O, A, A+B, B -->
    <polygon points="60,300 210,250 260,100 110,150" fill="#7b3fbf" opacity="0.12" stroke="#7b3fbf" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="150" y="190" fill="#7b3fbf" font-weight="600">面積 = 8</text>
    <text x="150" y="206" fill="#7b3fbf" font-size="12">= 底 |a| × 高 PB</text>
    <!-- a 的方向線 -->
    <line x1="60" y1="300" x2="320" y2="213.3" stroke="#1f5fbf" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
    <!-- 高 PB（外積用） -->
    <line x1="150" y1="270" x2="110" y2="150" stroke="#7b3fbf" stroke-width="5" opacity="0.85"/>
    <text x="158" y="224" fill="#7b3fbf" font-weight="600">高 PB = 2.53</text>
    <text x="158" y="239" fill="#7b3fbf" font-size="12">= |b| sin θ</text>
    <!-- 直角 at P -->
    <polygon points="150,270 140.5,273.2 137.3,263.7 146.8,260.5" fill="none" stroke="#444" stroke-width="1.5"/>
    <!-- 影子 OP（內積用） -->
    <line x1="60" y1="300" x2="150" y2="270" stroke="#2a9d5c" stroke-width="5" opacity="0.85"/>
    <text x="150" y="292" fill="#2a9d5c" font-weight="600">影子 OP = 1.90 = |b| cos θ</text>
    <!-- a -->
    <line x1="60" y1="300" x2="210" y2="250" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ar-a)"/>
    <text x="214" y="262" fill="#1f5fbf" font-weight="600">a = (3, 1)</text>
    <!-- b -->
    <line x1="60" y1="300" x2="110" y2="150" stroke="#d1495b" stroke-width="2.5" marker-end="url(#ar-b)"/>
    <text x="100" y="140" fill="#d1495b" font-weight="600">b = (1, 3)　在 a 的左邊 → a × b = +8</text>
    <!-- b' 鏡像 -->
    <line x1="60" y1="300" x2="210" y2="350" stroke="#e39aa5" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#ar-b2)"/>
    <text x="214" y="356" fill="#c97a86">b' = (3, −1)　在 a 的右邊 → a × b' = −6</text>
    <!-- points -->
    <circle cx="60" cy="300" r="3" fill="#222"/><text x="46" y="316" fill="#222">O</text>
    <circle cx="150" cy="270" r="3.5" fill="#444"/><text x="154" y="280" fill="#444" font-size="12">P</text>
    <!-- 算式 -->
    <text x="60" y="392" fill="#222">同一個直角三角形 O–P–B：鄰邊 OP = 1.90，對邊 PB = 2.53，斜邊 |b| = 3.16</text>
    <text x="60" y="412" fill="#2a9d5c">內積 a·b = |a| × 鄰邊 = 3.16 × 1.90 = 6　＝ 3·1 + 1·3</text>
    <text x="60" y="432" fill="#7b3fbf">外積 a×b = |a| × 對邊 = 3.16 × 2.53 = 8　＝ 3·3 − 1·1（有號面積）</text>
    <text x="60" y="452" fill="#222">檢查：6² + 8² = 100 = (|a||b|)² = (3.16 × 3.16)²　→ cos² + sin² = 1</text>
  </g>

  <!-- ===== 右：3D，外積是一支向量 ===== -->
  <g>
    <text x="560" y="24" font-size="14" font-weight="600" fill="#222">右：3D　a × b 是一支向量，垂直於 a 和 b</text>
    <!-- 地板平面（斜投影） -->
    <polygon points="560,330 900,330 840,230 500,230" fill="#f3f3f3" stroke="#ddd" stroke-width="1"/>
    <text x="862" y="322" fill="#999" font-size="11">a、b 所在的平面</text>
    <!-- 平行四邊形 O, A, A+B, B 在平面上 -->
    <!-- O=(700,300) A=(840,290) B=(660,240) A+B=(800,230) -->
    <polygon points="700,300 840,290 800,230 660,240" fill="#7b3fbf" opacity="0.15" stroke="#7b3fbf" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="730" y="268" fill="#7b3fbf" font-size="12">面積 = |a × b|</text>
    <!-- a, b -->
    <line x1="700" y1="300" x2="840" y2="290" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ar-a)"/>
    <text x="846" y="296" fill="#1f5fbf" font-weight="600">a</text>
    <line x1="700" y1="300" x2="660" y2="240" stroke="#d1495b" stroke-width="2.5" marker-end="url(#ar-b)"/>
    <text x="640" y="236" fill="#d1495b" font-weight="600">b</text>
    <!-- 法向量 n = a×b 向上 -->
    <line x1="700" y1="300" x2="700" y2="130" stroke="#7b3fbf" stroke-width="3" marker-end="url(#ar-n)"/>
    <text x="708" y="140" fill="#7b3fbf" font-weight="600">a × b</text>
    <text x="640" y="110" fill="#7b3fbf" font-size="12">方向：⊥ a 與 b（右手定則：a 轉向 b，拇指所指）</text>
    <text x="640" y="126" fill="#7b3fbf" font-size="12">長度：|a||b| sin θ = 平行四邊形面積</text>
    <!-- 直角記號 -->
    <polyline points="700,288 710,287 710,299" fill="none" stroke="#444" stroke-width="1.2"/>
    <polyline points="700,288 697,283 697,295" fill="none" stroke="#444" stroke-width="1.2"/>
    <!-- 反向 -->
    <line x1="700" y1="300" x2="700" y2="400" stroke="#c9b3e6" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#ar-n)" opacity="0.8"/>
    <text x="708" y="398" fill="#9a7bc0" font-size="12">b × a = −(a × b)：同長、反向</text>
    <circle cx="700" cy="300" r="3" fill="#222"/><text x="686" y="314" fill="#222">O</text>
    <text x="560" y="432" fill="#222">結果仍在 3D（三個分量），沒有多出維度；</text>
    <text x="560" y="452" fill="#222">2D 版沒有第三軸可指，所以只剩「面積 + 正負號」。</text>
  </g>
</svg>
