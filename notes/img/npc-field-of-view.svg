<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <clipPath id="map"><rect x="20" y="90" width="380" height="300"/></clipPath>
  </defs>

  <text x="20" y="26" font-size="14" font-weight="600" fill="#222">俯視圖：NPC 在 N = (2, 2)，面朝 f = (2, 1)。d = 目標 − N。內積判前後、外積判左右。</text>

  <g clip-path="url(#map)">
    <!-- 前半平面（f 指向的那一側）淡藍 -->
    <!-- 垂直線通過 N=(180,250)，方向 (−1,2)→像素 (−40,−80)；前側是 f 方向 -->
    <polygon points="120,130 240,370 500,370 500,130" fill="#1f5fbf" opacity="0.06"/>
    <!-- 左半（f 的左邊 = 面朝線上方）淡紅 -->
    <polygon points="20,330 380,150 500,150 500,0 20,0" fill="#d1495b" opacity="0.05"/>
    <!-- grid -->
    <g stroke="#e9e9e9" stroke-width="1">
      <line x1="20" y1="130" x2="400" y2="130"/><line x1="20" y1="170" x2="400" y2="170"/><line x1="20" y1="210" x2="400" y2="210"/><line x1="20" y1="250" x2="400" y2="250"/><line x1="20" y1="290" x2="400" y2="290"/><line x1="20" y1="330" x2="400" y2="330"/><line x1="20" y1="370" x2="400" y2="370"/>
      <line x1="60" y1="90" x2="60" y2="390"/><line x1="100" y1="90" x2="100" y2="390"/><line x1="140" y1="90" x2="140" y2="390"/><line x1="180" y1="90" x2="180" y2="390"/><line x1="220" y1="90" x2="220" y2="390"/><line x1="260" y1="90" x2="260" y2="390"/><line x1="300" y1="90" x2="300" y2="390"/><line x1="340" y1="90" x2="340" y2="390"/><line x1="380" y1="90" x2="380" y2="390"/>
    </g>
    <!-- 面朝線（內積 = 0 的線？不：外積 = 0 的線） -->
    <line x1="20" y1="330" x2="380" y2="150" stroke="#d1495b" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="300" y="166" fill="#d1495b" font-size="11">面朝線：外積 = 0</text>
    <!-- 垂直線（內積 = 0） -->
    <line x1="120" y1="130" x2="240" y2="370" stroke="#1f5fbf" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="232" y="384" fill="#1f5fbf" font-size="11">側線：內積 = 0</text>
    <!-- 區域標籤 -->
    <text x="300" y="110" fill="#777" font-size="12">前左（+, +）</text>
    <text x="300" y="330" fill="#777" font-size="12">前右（+, −）</text>
    <text x="30" y="150" fill="#777" font-size="12">後左（−, +）</text>
    <text x="40" y="330" fill="#777" font-size="12">後右（−, −）</text>
    <!-- d 向量 -->
    <line x1="180" y1="250" x2="340" y2="130" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar-d)"/>
    <line x1="180" y1="250" x2="300" y2="290" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar-d)"/>
    <line x1="180" y1="250" x2="60" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar-d)"/>
    <line x1="180" y1="250" x2="140" y2="370" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar-d)"/>
    <line x1="180" y1="250" x2="340" y2="170" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar-d)"/>
    <!-- f -->
    <line x1="180" y1="250" x2="260" y2="210" stroke="#1f5fbf" stroke-width="3" marker-end="url(#ar-f)"/>
    <text x="214" y="246" fill="#1f5fbf" font-weight="600">f = (2, 1)</text>
    <!-- NPC -->
    <circle cx="180" cy="250" r="7" fill="#1f5fbf"/>
    <text x="118" y="268" fill="#1f5fbf" font-weight="600">N (2, 2)</text>
    <!-- targets -->
    <circle cx="340" cy="130" r="5" fill="#333"/><text x="348" y="134" fill="#333" font-weight="600">T1 (6, 5)</text>
    <circle cx="300" cy="290" r="5" fill="#333"/><text x="308" y="304" fill="#333" font-weight="600">T2 (5, 1)</text>
    <circle cx="60" cy="210" r="5" fill="#333"/><text x="30" y="200" fill="#333" font-weight="600">T3 (−1, 3)</text>
    <circle cx="140" cy="370" r="5" fill="#333"/><text x="92" y="366" fill="#333" font-weight="600">T4 (1, −1)</text>
    <circle cx="340" cy="170" r="5" fill="#333"/><text x="348" y="182" fill="#333" font-weight="600">T5 (6, 4)</text>
  </g>

  <!-- ===== 右：表 ===== -->
  <g font-size="12">
    <text x="430" y="104" font-weight="600" fill="#222">目標</text>
    <text x="480" y="104" font-weight="600" fill="#222">d = T − N</text>
    <text x="570" y="104" font-weight="600" fill="#1f5fbf">f·d</text>
    <text x="655" y="104" font-weight="600" fill="#d1495b">f×d</text>
    <text x="735" y="104" font-weight="600" fill="#222">判定</text>
    <text x="795" y="104" font-weight="600" fill="#222">局部座標 (前, 左)</text>
    <line x1="430" y1="112" x2="930" y2="112" stroke="#999"/>

    <text x="430" y="134" fill="#222">T1</text><text x="480" y="134" fill="#222">(4, 3)</text><text x="570" y="134" fill="#1f5fbf">8+3 = 11</text><text x="655" y="134" fill="#d1495b">6−4 = +2</text><text x="735" y="134" fill="#222">前左</text><text x="795" y="134" fill="#222">(4.92, 0.89)</text>
    <text x="430" y="160" fill="#222">T2</text><text x="480" y="160" fill="#222">(3, −1)</text><text x="570" y="160" fill="#1f5fbf">6−1 = 5</text><text x="655" y="160" fill="#d1495b">−2−3 = −5</text><text x="735" y="160" fill="#222">前右</text><text x="795" y="160" fill="#222">(2.24, −2.24)</text>
    <text x="430" y="186" fill="#222">T3</text><text x="480" y="186" fill="#222">(−3, 1)</text><text x="570" y="186" fill="#1f5fbf">−6+1 = −5</text><text x="655" y="186" fill="#d1495b">2+3 = +5</text><text x="735" y="186" fill="#222">後左</text><text x="795" y="186" fill="#222">(−2.24, 2.24)</text>
    <text x="430" y="212" fill="#222">T4</text><text x="480" y="212" fill="#222">(−1, −3)</text><text x="570" y="212" fill="#1f5fbf">−2−3 = −5</text><text x="655" y="212" fill="#d1495b">−6+1 = −5</text><text x="735" y="212" fill="#222">後右</text><text x="795" y="212" fill="#222">(−2.24, −2.24)</text>
    <text x="430" y="238" fill="#222">T5</text><text x="480" y="238" fill="#222">(4, 2)</text><text x="570" y="238" fill="#1f5fbf">8+2 = 10</text><text x="655" y="238" fill="#d1495b">4−4 = 0</text><text x="735" y="238" fill="#222">正前方</text><text x="795" y="238" fill="#222">(4.47, 0)</text>
    <line x1="430" y1="248" x2="930" y2="248" stroke="#999"/>

    <text x="430" y="278" fill="#222">f·d = 2·d₁ + 1·d₂　　f×d = 2·d₂ − 1·d₁　　|f| = √5 = 2.24</text>
    <text x="430" y="304" fill="#1f5fbf">內積：d 在面朝方向上的影子 → 正 = 前、負 = 後；= 0 落在藍色側線上。</text>
    <text x="430" y="326" fill="#d1495b">外積：d 與 f 張開的有號面積 → 正 = 左、負 = 右；= 0 落在紅色面朝線上（T5）。</text>
    <text x="430" y="352" fill="#222">兩條線把地圖切成四格；兩個符號 = 四格的門牌。</text>
    <text x="430" y="378" fill="#222">局部座標：把 f 當新的 x 軸，(f·d, f×d) ÷ |f| 就是目標在「NPC 自己的座標系」裡的位置</text>
    <text x="430" y="396" fill="#222">——內積讀前進量、外積讀左偏量，兩個讀數就是 06 筆記的「換基底」。</text>
    <text x="430" y="422" fill="#777" font-size="11">注意：f 畫在 N 上只是方便看；f 是方向，不是位置，不能拿去和 T 相減（06 筆記陷阱 4）。</text>
  </g>
</svg>
