<text x="24" y="30" fill="#222" font-size="16" font-weight="600" text-anchor="start">同一個結構，兩個角色：大矩陣 ＝ 瘦 × 瘦，中間的寬度 ＝ 秩</text>
<rect x="14" y="48" width="982" height="258" fill="#fbfbfb" stroke="#e2e2e2" rx="6"/>
<text x="28" y="72" fill="#1f5fbf" font-size="15" font-weight="600" text-anchor="start">推薦系統：用低秩去「近似資料」</text>
<rect x="240" y="92" width="150" height="150" fill="#fff" stroke="#999" stroke-width="1.5" rx="2"/>
