<line x1="375" y1="92" x2="375" y2="242" stroke="#eee"/>
<line x1="240" y1="227" x2="390" y2="227" stroke="#eee"/>
<rect x="256" y="93" width="13" height="13" fill="#8aa6d6"/>
<rect x="241" y="228" width="13" height="13" fill="#8aa6d6"/>
<rect x="316" y="108" width="13" height="13" fill="#8aa6d6"/>
<rect x="361" y="108" width="13" height="13" fill="#8aa6d6"/>
<rect x="286" y="213" width="13" height="13" fill="#8aa6d6"/>
